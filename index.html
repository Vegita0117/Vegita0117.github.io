<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記憶時鐘</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink: #10132B;
    --night: #1B1F3B;
    --night-deep: #12152C;
    --brass: #C9A227;
    --brass-soft: #E4C862;
    --ivory: #F1EAD6;
    --wrong: #B23A2E;
    --right: #3E7C59;
    --ring: #2A2F55;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 30%, var(--night) 0%, var(--night-deep) 70%, #0B0D1E 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ivory);
    overflow-x: hidden;
  }

  .stage{
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 32px 16px 48px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    color: var(--ivory);
  }

  .sub{
    font-size: 14px;
    color: #9AA0C4;
    margin-bottom: 36px;
    text-align: center;
    max-width: 380px;
    line-height: 1.6;
  }

  .clock-wrap{
    position: relative;
    width: min(84vw, 420px);
    height: min(84vw, 420px);
    border-radius: 50%;
    background: var(--ring);
    box-shadow:
      inset 0 0 0 1px rgba(201,162,39,0.25),
      inset 0 30px 60px rgba(0,0,0,0.35),
      0 20px 60px rgba(0,0,0,0.5);
  }

  .clock-wrap::before{
    content:'';
    position:absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px dashed rgba(201,162,39,0.18);
  }

  .center{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 46%;
    height: 46%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #23274a, var(--ink));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: inset 0 0 0 1px rgba(201,162,39,0.2);
    padding: 8px;
  }

  .center .label{
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #8A90B8;
    margin-bottom: 6px;
  }

  .center .value{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 46px);
    color: var(--brass-soft);
    line-height: 1;
  }

  .center .value.win{
    color: var(--right);
    font-size: clamp(20px, 5vw, 26px);
  }

  .center .value.wrong{
    color: var(--wrong);
  }

  .card{
    position:absolute;
    width: 54px;
    height: 54px;
    margin-left: -27px;
    margin-top: -27px;
    cursor: pointer;
    perspective: 600px;
  }

  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform 0.4s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    backface-visibility: hidden;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 20px;
  }

  .face.back{
    background: linear-gradient(155deg, #2A2F55, #1E2246);
    box-shadow: inset 0 0 0 1px rgba(201,162,39,0.3), 0 4px 10px rgba(0,0,0,0.4);
    color: var(--brass);
  }

  .face.back::after{
    content:'✦';
    font-size: 14px;
    opacity: 0.7;
  }

  .face.front{
    background: var(--ivory);
    color: var(--ink);
    transform: rotateY(180deg);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  .card.matched .face.front{
    background: #FBF3D6;
    color: var(--right);
    box-shadow: 0 0 0 2px var(--brass), 0 0 18px rgba(201,162,39,0.55);
  }

  .card.wrong .face.front{
    background: #F1D9D4;
    color: var(--wrong);
  }

  .card.shake .card-inner{
    animation: shake 0.4s;
  }

  @keyframes shake{
    0%,100%{ transform: rotateY(180deg) translateX(0); }
    25%{ transform: rotateY(180deg) translateX(-6px); }
    75%{ transform: rotateY(180deg) translateX(6px); }
  }

  .card.locked{
    pointer-events: none;
  }

  .timer{
    margin-top: 22px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.03em;
    color: #B9BEE0;
    font-variant-numeric: tabular-nums;
  }

  .timer .unit{
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: #6A70A0;
    margin-left: 2px;
  }

  .timer.done{
    color: var(--brass-soft);
  }

  .restart{
    margin-top: 20px;
    background: none;
    border: 1px solid rgba(201,162,39,0.4);
    color: var(--brass-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .restart:hover{
    background: rgba(201,162,39,0.1);
    border-color: var(--brass);
  }

  .restart:focus-visible, .card:focus-visible{
    outline: 2px solid var(--brass-soft);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner, .card.shake .card-inner{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1>記憶時鐘</h1>
  <p class="sub">12 張牌，位置不會變。依序找出 1 到 12，翻錯全部蓋回去，重新開始。</p>

  <div class="clock-wrap" id="clockWrap">
    <div class="center">
      <div class="label" id="statusLabel">下一個</div>
      <div class="value" id="statusValue">1</div>
    </div>
    <!-- cards injected by JS -->
  </div>

  <div class="timer" id="timerDisplay">00:00<span class="unit">.00</span></div>

  <button class="restart" id="restartBtn">重新排列</button>
</div>

<canvas id="confettiCanvas" style="position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10;"></canvas>

<script>
(function(){
  const wrap = document.getElementById('clockWrap');
  const statusLabel = document.getElementById('statusLabel');
  const statusValue = document.getElementById('statusValue');
  const restartBtn = document.getElementById('restartBtn');
  const timerDisplay = document.getElementById('timerDisplay');

  const TOTAL = 12;
  let numbers = [];
  let cards = [];
  let expected = 1;
  let busy = false;

  let timerInterval = null;
  let startTime = null;
  let elapsedMs = 0;
  let timerRunning = false;

  function formatTime(ms){
    const totalCentis = Math.floor(ms / 10);
    const centis = totalCentis % 100;
    const totalSeconds = Math.floor(totalCentis / 100);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);
    const pad2 = (n) => String(n).padStart(2, '0');
    return { main: `${pad2(minutes)}:${pad2(seconds)}`, centis: pad2(centis) };
  }

  function renderTimer(ms, done){
    const { main, centis } = formatTime(ms);
    timerDisplay.innerHTML = `${main}<span class="unit">.${centis}</span>`;
    timerDisplay.classList.toggle('done', !!done);
  }

  function startTimer(){
    if(timerRunning) return;
    timerRunning = true;
    startTime = performance.now() - elapsedMs;
    timerInterval = setInterval(() => {
      elapsedMs = performance.now() - startTime;
      renderTimer(elapsedMs, false);
    }, 30);
  }

  function stopTimer(){
    timerRunning = false;
    if(timerInterval){
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function resetTimer(){
    stopTimer();
    elapsedMs = 0;
    renderTimer(0, false);
  }

  // ---- Celebration: confetti + fanfare ----
  const confettiCanvas = document.getElementById('confettiCanvas');
  const ctx = confettiCanvas.getContext('2d');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let confettiPieces = [];
  let confettiRAF = null;

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const confettiColors = ['#C9A227', '#E4C862', '#F1EAD6', '#3E7C59', '#8A90D8'];

  function spawnConfetti(){
    const count = prefersReducedMotion ? 0 : 140;
    confettiPieces = [];
    for(let i = 0; i < count; i++){
      confettiPieces.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * 0.5,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 8,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.25,
        vy: 2 + Math.random() * 2.5,
        vx: (Math.random() - 0.5) * 1.5,
        drift: Math.random() * Math.PI * 2,
        life: 0
      });
    }
    if(count > 0){
      cancelAnimationFrame(confettiRAF);
      runConfetti();
    }
  }

  function runConfetti(){
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    confettiPieces.forEach(p => {
      p.life += 1;
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.drift + p.life * 0.05) * 0.6;
      p.rot += p.rotSpeed;
      if(p.y < confettiCanvas.height + 20) alive = true;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    if(alive){
      confettiRAF = requestAnimationFrame(runConfetti);
    } else {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  function clearConfetti(){
    cancelAnimationFrame(confettiRAF);
    confettiPieces = [];
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }

  let audioCtx = null;

  function playNote(freq, startTime, duration, type, peakGain){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + Math.min(0.02, duration * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function playFanfare(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      // Note frequencies (C major, C5..E6)
      const C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99,
            A5=880.00, B5=987.77, C6=1046.50, D6=1174.66, E6=1318.51;

      let t = now;

      // Segment A (0-2s): bubbly bouncing arpeggio, up then down, twice
      const segA = [C5, E5, G5, C6, G5, E5, C5, E5, G5, C6, G5, E5];
      segA.forEach(freq => { playNote(freq, t, 0.16, 'triangle', 0.16); t += 0.1667; });

      // Segment B (2-4s): playful scale walk up and down
      const segB = [C5, D5, E5, F5, G5, F5, E5, D5, C5, D5, E5, G5];
      segB.forEach(freq => { playNote(freq, t, 0.16, 'triangle', 0.16); t += 0.1667; });

      // Segment C (4-5.5s): rising run building excitement
      const segC = [C5, D5, E5, F5, G5, A5, B5, C6];
      segC.forEach(freq => { playNote(freq, t, 0.18, 'square', 0.1); t += 0.1875; });

      // Segment D (5.5-6s): triumphant final chord
      [C5, E5, G5, C6].forEach(freq => playNote(freq, t, 0.5, 'triangle', 0.14));
    } catch(e){
      // audio not available; celebration continues silently
    }
  }

  function celebrate(){
    spawnConfetti();
    playFanfare();
  }

  function shuffledNumbers(){
    const arr = Array.from({length: TOTAL}, (_, i) => i + 1);
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function layout(){
    // Clock positions for 1..12 slots (visual slots, not the numbers themselves)
    const radius = wrap.clientWidth * 0.38;
    const center = wrap.clientWidth / 2;
    const positions = [];
    for(let i = 0; i < TOTAL; i++){
      const angle = (i / TOTAL) * 2 * Math.PI - Math.PI / 2; // 12 at top
      positions.push({
        x: center + radius * Math.cos(angle),
        y: center + radius * Math.sin(angle)
      });
    }
    return positions;
  }

  function buildBoard(){
    wrap.querySelectorAll('.card').forEach(el => el.remove());
    numbers = shuffledNumbers();
    cards = [];
    expected = 1;
    updateStatus('下一個', String(expected), '');
    resetTimer();
    clearConfetti();

    const positions = layout();
    numbers.forEach((num, idx) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.tabIndex = 0;
      el.style.left = positions[idx].x + 'px';
      el.style.top = positions[idx].y + 'px';
      el.dataset.number = num;
      el.innerHTML = `
        <div class="card-inner">
          <div class="face back"></div>
          <div class="face front">${num}</div>
        </div>
      `;
      el.addEventListener('click', () => onCardClick(el));
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          onCardClick(el);
        }
      });
      wrap.appendChild(el);
      cards.push(el);
    });
  }

  function updateStatus(label, value, cls){
    statusLabel.textContent = label;
    statusValue.textContent = value;
    statusValue.className = 'value' + (cls ? ' ' + cls : '');
  }

  function onCardClick(el){
    if(busy) return;
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;

    startTimer();

    const num = parseInt(el.dataset.number, 10);
    el.classList.add('flipped');

    if(num === expected){
      el.classList.add('matched');
      expected++;
      if(expected > TOTAL){
        busy = true;
        stopTimer();
        renderTimer(elapsedMs, true);
        const { main, centis } = formatTime(elapsedMs);
        updateStatus('過關時間', `${main}.${centis}`, 'win');
        cards.forEach(c => c.classList.add('locked'));
        celebrate();
        setTimeout(() => { busy = false; }, 300);
      } else {
        updateStatus('下一個', String(expected), '');
      }
    } else {
      busy = true;
      el.classList.add('wrong', 'shake');
      updateStatus('翻錯了', String(num), 'wrong');
      cards.forEach(c => c.classList.add('locked'));

      setTimeout(() => {
        cards.forEach(c => {
          c.classList.remove('flipped', 'matched', 'wrong', 'shake', 'locked');
        });
        expected = 1;
        updateStatus('下一個', String(expected), '');
        busy = false;
      }, 700);
    }
  }

  restartBtn.addEventListener('click', buildBoard);
  window.addEventListener('resize', () => {
    const positions = layout();
    cards.forEach((el, idx) => {
      el.style.left = positions[idx].x + 'px';
      el.style.top = positions[idx].y + 'px';
    });
  });

  buildBoard();
})();
</script>

</body>
</html>
