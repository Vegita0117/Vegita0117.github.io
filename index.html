<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿達的遊樂場</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap');

  :root{
    --bg: #090a1c;
    --bg2: #14103a;
    --pink: #ff3ea5;
    --cyan: #2de2e6;
    --yellow: #ffe14d;
    --green: #6bff8a;
    --purple: #9b5cff;
    --text: #e9e7ff;
    --dim: #7d7aa8;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% 0%, #2a1566 0%, transparent 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'DotGothic16', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    overflow-x: hidden;
  }

  /* CRT scanlines + vignette */
  body::before{
    content:'';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.22) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 50;
  }

  body::after{
    content:'';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 49;
  }

  /* neon grid floor */
  .floor{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 38vh;
    background:
      linear-gradient(to bottom, rgba(9,10,28,1) 0%, rgba(9,10,28,0) 60%),
      repeating-linear-gradient(90deg, rgba(255,62,165,0.25) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, rgba(45,226,230,0.22) 0 1px, transparent 1px 36px);
    transform: perspective(300px) rotateX(55deg);
    transform-origin: bottom;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 18px 56px;
  }

  header{
    text-align: center;
    margin-bottom: 36px;
  }

  .eyebrow{
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--cyan);
    margin-bottom: 18px;
    text-shadow: 0 0 8px rgba(45,226,230,0.8);
  }

  h1{
    margin: 0;
    font-family: 'DotGothic16', 'Noto Sans TC', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 11vw, 68px);
    line-height: 1.15;
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow:
      0 0 6px #fff,
      0 0 14px var(--pink),
      0 0 30px var(--pink),
      3px 3px 0 var(--purple);
    animation: flicker 5s infinite;
  }

  .start{
    margin-top: 26px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--yellow);
    letter-spacing: 0.12em;
    text-shadow: 0 0 10px rgba(255,225,77,0.7);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink{
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: 0; }
  }

  @keyframes flicker{
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.82; }
    94% { opacity: 1; }
    96% { opacity: 0.88; }
  }

  .section-title{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--green);
    text-shadow: 0 0 8px rgba(107,255,138,0.6);
    margin: 0 0 18px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
  }

  .card{
    --c: var(--cyan);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 20px 20px;
    background: linear-gradient(160deg, rgba(30,24,78,0.92), rgba(14,12,44,0.96));
    border: 3px solid var(--c);
    border-radius: 6px;
    box-shadow:
      0 0 0 3px #090a1c,
      0 0 0 5px color-mix(in srgb, var(--c) 45%, transparent),
      0 0 24px color-mix(in srgb, var(--c) 40%, transparent),
      inset 0 0 28px color-mix(in srgb, var(--c) 12%, transparent);
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  a.card:hover, a.card:focus-visible{
    transform: translateY(-4px);
    box-shadow:
      0 0 0 3px #090a1c,
      0 0 0 5px var(--c),
      0 0 38px color-mix(in srgb, var(--c) 70%, transparent),
      inset 0 0 34px color-mix(in srgb, var(--c) 20%, transparent);
    outline: none;
  }

  a.card:active{ transform: translateY(0); }

  .card .icon{
    font-size: 54px;
    line-height: 1;
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 80%, transparent));
    image-rendering: pixelated;
  }

  .card h2{
    margin: 4px 0 0;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent);
  }

  .card p{
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
    color: #cfcdf0;
    flex: 1;
  }

  .meta{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }

  .tag{
    font-size: 12px;
    padding: 3px 8px;
    border: 1px solid color-mix(in srgb, var(--c) 70%, transparent);
    color: var(--c);
    border-radius: 3px;
  }

  .badge{
    align-self: flex-start;
    margin-top: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 10px 14px;
    background: var(--c);
    color: #0b0a24;
    border-radius: 3px;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 40%, #000);
  }

  a.card:hover .badge{ animation: blink 0.8s steps(1) infinite; }

  .card.soon{
    --c: #6d6a99;
    opacity: 0.62;
    cursor: not-allowed;
    box-shadow:
      0 0 0 3px #090a1c,
      0 0 0 5px rgba(109,106,153,0.4);
  }

  .card.soon .icon{ filter: grayscale(1) opacity(0.7); }

  .card.soon .badge{
    background: transparent;
    color: var(--dim);
    border: 2px dashed var(--dim);
    box-shadow: none;
  }

  footer{
    margin-top: 48px;
    text-align: center;
    font-size: 13px;
    color: var(--dim);
    line-height: 1.9;
  }

  footer .pix{
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #5d5a8a;
  }

  @media (prefers-reduced-motion: reduce){
    h1, .start, a.card:hover .badge{ animation: none; }
    .card{ transition: none; }
  }
</style>
</head>
<body>

<div class="floor" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">ADA'S ARCADE</div>
    <h1>阿達的遊樂場</h1>
    <div class="start">PRESS START</div>
  </header>

  <h2 class="section-title">SELECT GAME</h2>
  <main class="grid" id="grid"></main>

  <footer>
    <div>新遊戲陸續上架中，敬請期待！</div>
    <div class="pix">&copy; ADA'S ARCADE</div>
  </footer>
</div>

<script>
(function(){
  // ================================================================
  // 新增遊戲：在下面的陣列加一個物件就會多一張卡片。
  //   title  遊戲名稱
  //   desc   一兩句介紹
  //   href   遊戲檔名（例如 'memory-clock.html'）
  //   icon   卡片上的大圖示（emoji）
  //   color  霓虹色：'cyan' | 'pink' | 'yellow' | 'green' | 'purple'
  //   tags   小標籤（陣列）
  //   status 'live' = 可以玩，'soon' = 即將推出（不能點）
  // ================================================================
  const GAMES = [
    {
      title: '記憶時鐘',
      desc: '12 張牌排成鐘面，記住位置，依序翻出數字。初級、中級、高級三關闖關，挑戰你的最快通關時間！',
      href: 'memory-clock.html',
      icon: '🕰️',
      color: 'yellow',
      tags: ['記憶力', '三關闖關', '計時'],
      status: 'live'
    },
    {
      title: '雷霆空戰',
      desc: '駕駛戰機穿越砲火，打倒敵人。空戰射擊遊戲製作中。',
      href: '#',
      icon: '✈️',
      color: 'cyan',
      tags: ['射擊', '動作'],
      status: 'soon'
    },
    {
      title: '飲食健康測驗',
      desc: '選一選你一天三餐吃了什麼，測測你的飲食健不健康。',
      href: '#',
      icon: '🥗',
      color: 'green',
      tags: ['測驗', '健康'],
      status: 'soon'
    }
  ];

  const COLORS = {
    cyan: 'var(--cyan)',
    pink: 'var(--pink)',
    yellow: 'var(--yellow)',
    green: 'var(--green)',
    purple: 'var(--purple)'
  };

  const grid = document.getElementById('grid');

  GAMES.forEach(g => {
    const live = g.status === 'live';
    const el = document.createElement(live ? 'a' : 'div');
    el.className = 'card' + (live ? '' : ' soon');
    el.style.setProperty('--c', COLORS[g.color] || COLORS.cyan);
    if(live){
      el.href = g.href;
    } else {
      el.setAttribute('aria-disabled', 'true');
    }

    const tags = (g.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    el.innerHTML = `
      <div class="icon" aria-hidden="true">${g.icon}</div>
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="meta">${tags}</div>
      <div class="badge">${live ? '▶ PLAY' : 'COMING SOON'}</div>
    `;
    grid.appendChild(el);
  });
})();
</script>

</body>
</html>
